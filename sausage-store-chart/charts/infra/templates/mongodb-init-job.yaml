apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init-reports-user
  annotations:
    # helm.sh/hook: post-install,post-upgrade
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      name: mongodb-init-reports-user
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongosh
          image: mongo:7.0
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          command:
            - sh
            - -c
            - |
              echo "Waiting for MongoDB to be ready..."
              until mongosh --host mongodb --username root --password rootpassword --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })' > /dev/null 2>&1; do
                echo "MongoDB not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "MongoDB is up. Creating user 'reports'..."
              mongosh --host mongodb --username root --password rootpassword --authenticationDatabase admin --eval '
                db = db.getSiblingDB("sausage-store");
                if (!db.getUser("reports")) {
                  db.createUser({
                    user: "reports",
                    pwd: "reportspassword",
                    roles: [{ role: "readWrite", db: "sausage-store" }]
                  });
                  print("User reports created successfully");
                } else {
                  print("User reports already exists, skipping");
                }
              '
              echo "Done"